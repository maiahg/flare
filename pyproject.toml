[project]
name = "flare"
version = "0.1.0"
description = "Incident Response AI assistant"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "arq>=0.25.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "greenlet>=3.5.4",
    "httpx>=0.28.1",
    "langfuse>=4.14.3",
    "langgraph>=1.2.10",
    "langgraph-checkpoint-postgres>=3.1.2",
    "mypy>=2.3.0",
    "openai>=2.53.0",
    "pgvector>=0.5.0",
    "pre-commit>=4.6.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
    "respx>=0.23.1",
    "ruff>=0.16.2",
    "sqlalchemy>=2.0.51",
    "types-pyyaml>=6.0.12.20260724",
    "uvicorn>=0.52.1",
]

[dependency-groups]
dev = [
    "respx>=0.23.1",
]
