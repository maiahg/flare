display_information:
  name: flare
features:
  bot_user:
    display_name: flare
    always_online: true
oauth_config:
  redirect_urls:
    - https://TUNNEL_URL/slack/oauth/callback
  scopes:
    bot:
      - chat:write
      - channels:history
      - channels:read
      - app_mentions:read
settings:
  event_subscriptions:
    request_url: https://TUNNEL_URL/slack/events
    bot_events:
      - message.channels
      - member_joined_channel
      - app_mention
  interactivity:
    is_enabled: true
    request_url: https://TUNNEL_URL/slack/interactions

