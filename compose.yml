services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: flare-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: vectordb
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vectordb"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  prometheus:
    profiles: ["real"]
    image: prom/prometheus:v2.54.1
    container_name: flare-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=6h"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped

  loki:
    profiles: ["real"]
    image: grafana/loki:3.1.1
    container_name: flare-loki
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "3100:3100"
    restart: unless-stopped

  unleash:
    profiles: ["real"]
    image: unleashorg/unleash-server:6.1
    container_name: flare-unleash
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:password@postgres:5432/unleash
      DATABASE_SSL: "false"
      INIT_CLIENT_API_TOKENS: "default:development.flare-local-read-token"
      INIT_ADMIN_API_TOKENS: "*:*.flare-local-admin-token"
    ports:
      - "4242:4242"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: flare-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data: